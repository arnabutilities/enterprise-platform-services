apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: enterprise-platform
data:
  API_BASE_URL: 'http://bff:3000'
  ANALYTICS_URL: 'http://analytics-mfe:5001'
  REPORTS_URL: 'http://reports-mfe:5002'
  LOGIN_URL: 'http://login-mfe:5003'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-shell
  namespace: enterprise-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: host-shell
  template:
    metadata:
      labels:
        app: host-shell
    spec:
      containers:
        - name: host-shell
          image: registry.example.com/host-shell:latest
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: 'production'
            - name: NEXT_PUBLIC_ANALYTICS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: ANALYTICS_URL
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: host-shell-service
  namespace: enterprise-platform
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3002
  selector:
    app: host-shell
