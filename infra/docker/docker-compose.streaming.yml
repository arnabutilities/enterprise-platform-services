version: '3.9'

# Optional Redpanda overlay for event-streaming experiments.
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.streaming.yml up -d

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
    ports:
      - '9092:9092'
      - '8081:8081'
    restart: unless-stopped
