bind 0.0.0.0
# Allow host -> published-port connections in local Docker dev.
# Health checks run inside the container; the BFF connects from the host OS.
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly no
